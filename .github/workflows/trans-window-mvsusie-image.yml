name: Trans-window mvSuSiE container

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "envs/trans-window-mvsusie.Dockerfile"
      - "envs/trans-window-mvsusie.environment.yml"
      - "scripts/trans_window_io.R"
      - "scripts/trans_window_logging.R"
      - "scripts/trans_window_preprocess.R"
      - "scripts/trans_window_model.R"
      - "scripts/trans_window_prior.R"
      - "scripts/trans_window_cli.R"
      - "scripts/prepare_window.R"
      - "scripts/fit_window.R"
      - "scripts/run_window_mvsusie.R"
      - "scripts/summarize_window.R"
      - "scripts/merge_window_outputs.R"
      - "scripts/plot_window_mvsusie.R"
      - "workflows/trans_window_mvsusie.wdl"
      - "tests/**"
  pull_request:
    branches: [main]
    paths:
      - "envs/trans-window-mvsusie.Dockerfile"
      - "envs/trans-window-mvsusie.environment.yml"
      - "scripts/trans_window_io.R"
      - "scripts/trans_window_logging.R"
      - "scripts/trans_window_preprocess.R"
      - "scripts/trans_window_model.R"
      - "scripts/trans_window_prior.R"
      - "scripts/trans_window_cli.R"
      - "scripts/prepare_window.R"
      - "scripts/fit_window.R"
      - "scripts/run_window_mvsusie.R"
      - "scripts/summarize_window.R"
      - "scripts/merge_window_outputs.R"
      - "scripts/plot_window_mvsusie.R"
      - "workflows/trans_window_mvsusie.wdl"
      - "tests/**"

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository_owner }}/mvsusier-trans-window-mvsusie

jobs:
  build-test-publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build image for smoke test
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./envs/trans-window-mvsusie.Dockerfile
          load: true
          push: false
          tags: trans-window-mvsusie-ci:latest

      - name: Verify R dependencies and scripts
        run: |
          docker run --rm trans-window-mvsusie-ci:latest Rscript -e '
            stopifnot(requireNamespace("mvsusieR", quietly = TRUE))
            stopifnot(requireNamespace("susieR", quietly = TRUE))
            stopifnot(requireNamespace("mashr", quietly = TRUE))
            stopifnot(requireNamespace("ggplot2", quietly = TRUE))
            stopifnot(packageVersion("mvsusieR") >= "0.3.0")
            stopifnot(packageVersion("susieR") >= "0.15.0")
            stopifnot(is.function(mvsusieR::mvsusie_plot))
            scripts <- c(
              "trans_window_io.R",
              "trans_window_logging.R",
              "trans_window_preprocess.R",
              "trans_window_model.R",
              "trans_window_prior.R",
              "trans_window_cli.R",
              "prepare_window.R",
              "fit_window.R",
              "run_window_mvsusie.R",
              "summarize_window.R",
              "merge_window_outputs.R",
              "plot_window_mvsusie.R"
            )
            stopifnot(all(file.exists(file.path("/opt/mvsusie/scripts", scripts))))
            source("/opt/mvsusie/scripts/trans_window_io.R")
            source("/opt/mvsusie/scripts/trans_window_model.R")
            stopifnot(all(c("start_L", "step_L", "max_L") %in% names(formals(make_model_config))))
            stopifnot("protein" %in% required_joint_modalities())
            source("/opt/mvsusie/scripts/trans_window_prior.R")
            set.seed(20260822)
            X <- matrix(rnorm(48), nrow = 8)
            Y <- matrix(rnorm(24), nrow = 8)
            marginal <- compute_marginal_bhat_shat_matrix(X, Y, block_size = 2)
            stopifnot(identical(dim(marginal$Bhat), c(6L, 3L)))
            stopifnot(identical(dim(marginal$Shat), c(6L, 3L)))
            stopifnot(all(is.finite(marginal$Bhat)), all(marginal$Shat > 0))
          '

      - name: Run the joint model smoke tests in the image
        run: |
          docker run --rm \
            -v "$PWD:/workspace" \
            -w /workspace \
            trans-window-mvsusie-ci:latest \
            bash -lc 'bash tests/test_trans_window_r.sh && Rscript tests/test_plot_window_mvsusie.R'

      - name: Install MiniWDL for workflow smoke tests
        run: python3 -m pip install miniwdl

      - name: Test raw and prepared-window WDL paths
        run: bash tests/test_trans_window_wdl_smoke.sh trans-window-mvsusie-ci:latest

      - name: Log in to GitHub Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract image metadata
        if: github.event_name != 'pull_request'
        id: metadata
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=sha
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Publish image
        if: github.event_name != 'pull_request'
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./envs/trans-window-mvsusie.Dockerfile
          push: true
          tags: ${{ steps.metadata.outputs.tags }}
          labels: ${{ steps.metadata.outputs.labels }}
