name: TransQTL BAM filtering container

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/transqtl-bam-filtering-image.yml"
      - "envs/transqtl-bam-filtering.Dockerfile"
      - "envs/transqtl-bam-filtering.environment.yml"
      - "workflows/transqtl_bam_filtering.wdl"
      - "tests/test_transqtl_bam_filtering_container.sh"
      - "tests/test_transqtl_bam_filtering_micromamba.sh"
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/transqtl-bam-filtering-image.yml"
      - "envs/transqtl-bam-filtering.Dockerfile"
      - "envs/transqtl-bam-filtering.environment.yml"
      - "workflows/transqtl_bam_filtering.wdl"
      - "tests/test_transqtl_bam_filtering_container.sh"
      - "tests/test_transqtl_bam_filtering_micromamba.sh"

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository_owner }}/transqtl-bam-filtering

jobs:
  build-test-publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build image for smoke test
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./envs/transqtl-bam-filtering.Dockerfile
          load: true
          push: false
          tags: transqtl-bam-filtering-ci:latest

      - name: Verify samtools
        run: docker run --rm transqtl-bam-filtering-ci:latest samtools --version

      - name: Verify RNA-SeQC2
        run: docker run --rm transqtl-bam-filtering-ci:latest rnaseqc --version

      - name: Verify tools without micromamba entrypoint
        run: >-
          docker run --rm --entrypoint /bin/bash
          transqtl-bam-filtering-ci:latest
          -c 'command -v samtools && command -v rnaseqc'

      - name: Verify micromamba environment
        run: docker run --rm transqtl-bam-filtering-ci:latest micromamba list --name base

      - name: Log in to GitHub Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract image metadata
        if: github.event_name != 'pull_request'
        id: metadata
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=sha
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Publish image
        if: github.event_name != 'pull_request'
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./envs/transqtl-bam-filtering.Dockerfile
          push: true
          tags: ${{ steps.metadata.outputs.tags }}
          labels: ${{ steps.metadata.outputs.labels }}
