name: Prepare-window phenotypes container

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "envs/prepare-window-phenotypes.Dockerfile"
      - "scripts/prepare_trans_window.R"
      - "scripts/trans_window_cli.R"
  pull_request:
    branches: [main]
    paths:
      - "envs/prepare-window-phenotypes.Dockerfile"
      - "scripts/prepare_trans_window.R"
      - "scripts/trans_window_cli.R"

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository_owner }}/mvsusier-prepare-window-phenotypes

jobs:
  build-test-publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build image for smoke test
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./envs/prepare-window-phenotypes.Dockerfile
          load: true
          push: false
          tags: prepare-window-phenotypes-ci:latest

      - name: Verify R dependencies and scripts
        run: |
          docker run --rm prepare-window-phenotypes-ci:latest Rscript -e '
            packages <- c("optparse", "dplyr", "purrr", "readr", "stringr", "tibble")
            stopifnot(all(vapply(packages, requireNamespace, logical(1), quietly = TRUE)))
            stopifnot(file.exists("/opt/mvsusie/scripts/prepare_trans_window.R"))
            stopifnot(file.exists("/opt/mvsusie/scripts/trans_window_cli.R"))
          '

      - name: Log in to GitHub Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract image metadata
        if: github.event_name != 'pull_request'
        id: metadata
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=sha
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Publish image
        if: github.event_name != 'pull_request'
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./envs/prepare-window-phenotypes.Dockerfile
          push: true
          tags: ${{ steps.metadata.outputs.tags }}
          labels: ${{ steps.metadata.outputs.labels }}
