name: LD-pruning container

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/docker-image.yml"
      - "envs/ld-pruning.Dockerfile"
      - "workflows/ld_pruning.wdl"
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/docker-image.yml"
      - "envs/ld-pruning.Dockerfile"
      - "workflows/ld_pruning.wdl"

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository_owner }}/mvsusier-ld-pruning

jobs:
  build-test-publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build image for smoke test
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./envs/ld-pruning.Dockerfile
          load: true
          push: false
          tags: ld-pruning-ci:latest

      - name: Verify PLINK 2
        run: docker run --rm ld-pruning-ci:latest plink2 --version

      - name: Log in to GitHub Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract image metadata
        if: github.event_name != 'pull_request'
        id: metadata
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=sha
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Publish image
        if: github.event_name != 'pull_request'
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./envs/ld-pruning.Dockerfile
          push: true
          tags: ${{ steps.metadata.outputs.tags }}
          labels: ${{ steps.metadata.outputs.labels }}
